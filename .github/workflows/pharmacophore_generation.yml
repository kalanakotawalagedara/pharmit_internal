name: Generate Interaction Pharmacophores

on:
  workflow_dispatch:
    inputs:
      csv_file:
        description: 'CSV file path (relative to repository root)'
        required: true
        default: 'Input/pdb_ligands.csv'
      batch_size:
        description: 'Batch size per job (leave empty to process all)'
        required: false
        default: ''
      num_batches:
        description: 'Number of parallel batches (1-20, empty for single job)'
        required: false
        default: ''

jobs:
  setup:
    name: Setup Job Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      total_entries: ${{ steps.count.outputs.total }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Count CSV entries
        id: count
        run: |
          TOTAL=$(tail -n +2 "${{ github.event.inputs.csv_file }}" | wc -l)
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "Total entries in CSV: $TOTAL"
      
      - name: Calculate batch matrix
        id: set-matrix
        run: |
          TOTAL=${{ steps.count.outputs.total }}
          NUM_BATCHES="${{ github.event.inputs.num_batches }}"
          BATCH_SIZE="${{ github.event.inputs.batch_size }}"
          
          if [ -z "$NUM_BATCHES" ] || [ "$NUM_BATCHES" -eq "0" ]; then
            # Single job mode
            echo "matrix={\"batch\":[0]}" >> $GITHUB_OUTPUT
            echo "Running single job for all $TOTAL entries"
          else
            # Calculate batch size if not provided
            if [ -z "$BATCH_SIZE" ]; then
              BATCH_SIZE=$(( ($TOTAL + $NUM_BATCHES - 1) / $NUM_BATCHES ))
            fi
            
            # Generate batch indices
            BATCHES="["
            for i in $(seq 0 $(($NUM_BATCHES - 1))); do
              START=$(($i * $BATCH_SIZE))
              if [ $START -lt $TOTAL ]; then
                if [ $i -gt 0 ]; then BATCHES="$BATCHES,"; fi
                BATCHES="$BATCHES$START"
              fi
            done
            BATCHES="$BATCHES]"
            
            echo "matrix={\"batch\":$BATCHES}" >> $GITHUB_OUTPUT
            echo "Running $NUM_BATCHES parallel jobs with batch size $BATCH_SIZE"
          fi

  generate:
    name: Generate Pharmacophores (Batch ${{ matrix.batch }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.10'
          channels: conda-forge,defaults
          channel-priority: strict
      
      - name: Cache Conda packages
        uses: actions/cache@v3
        with:
          path: ~/conda_pkgs_dir
          key: ${{ runner.os }}-conda-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-conda-
      
      - name: Install RDKit and dependencies
        shell: bash -el {0}
        run: |
          conda install -y -c conda-forge rdkit pandas numpy scipy requests python-dateutil
          python --version
          python -c "from rdkit import Chem; print('RDKit version:', Chem.rdBase.rdkitVersion)"
          python -c "import scipy; print('scipy version:', scipy.__version__)"
      
      - name: Determine batch parameters
        id: batch-params
        run: |
          BATCH_SIZE="${{ github.event.inputs.batch_size }}"
          if [ -z "$BATCH_SIZE" ]; then
            echo "batch_size=" >> $GITHUB_OUTPUT
            echo "batch_start=" >> $GITHUB_OUTPUT
          else
            echo "batch_size=$BATCH_SIZE" >> $GITHUB_OUTPUT
            echo "batch_start=${{ matrix.batch }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Run pharmacophore generation
        shell: bash -el {0}
        run: |
          BATCH_SIZE="${{ steps.batch-params.outputs.batch_size }}"
          BATCH_START="${{ steps.batch-params.outputs.batch_start }}"
          
          if [ -z "$BATCH_SIZE" ]; then
            # Process all entries
            python generate_pharmacophores.py \
              --csv "${{ github.event.inputs.csv_file }}" \
              --output Output
          else
            # Process batch
            python generate_pharmacophores.py \
              --csv "${{ github.event.inputs.csv_file }}" \
              --output Output \
              --batch-start $BATCH_START \
              --batch-size $BATCH_SIZE
          fi
      
      - name: Verify JSON output
        shell: bash -el {0}
        run: |
          JSON_COUNT=$(find Output -name "*.json" | wc -l)
          echo "Generated $JSON_COUNT JSON files"
          
          if [ "$JSON_COUNT" -eq "0" ]; then
            echo "ERROR: No JSON files generated"
            exit 1
          fi
          
          # Verify first JSON has atomic coordinates
          FIRST_JSON=$(find Output -name "*.json" | head -n 1)
          echo "Verifying: $FIRST_JSON"
          
          python << PYEOF
          import json
          import sys
          
          with open('$FIRST_JSON', 'r') as f:
              data = json.load(f)
          
          has_ligand = 'ligand_atoms' in data
          has_protein = 'protein_atoms' in data
          
          print(f"Has ligand_atoms: {has_ligand}")
          print(f"Has protein_atoms: {has_protein}")
          
          if has_ligand:
              print(f"Ligand atoms: {len(data['ligand_atoms'])}")
          if has_protein:
              print(f"Protein atoms: {len(data['protein_atoms'])}")
          
          if not (has_ligand and has_protein):
              print("\n✗ ERROR: JSON missing atomic coordinates!")
              print("  Exit vectors will NOT be computed during database build")
              sys.exit(1)
          else:
              print("\n✓ JSON has atomic coordinates for exit vector computation")
          PYEOF
      
      - name: Upload pharmacophore JSONs
        uses: actions/upload-artifact@v4
        with:
          name: pharmacophores-batch-${{ matrix.batch }}
          path: Output/*.json
          retention-days: 30
          if-no-files-found: warn
      
      - name: Upload processing log
        uses: actions/upload-artifact@v4
        with:
          name: logs-batch-${{ matrix.batch }}
          path: pharmacophore_generation.log
          retention-days: 7
          if-no-files-found: warn
  
  merge:
    name: Merge Results
    needs: [setup, generate]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Merge pharmacophore JSONs
        run: |
          mkdir -p Output
          find artifacts/pharmacophores-batch-* -name "*.json" -type f -exec cp {} Output/ \;
          
          TOTAL_FILES=$(find Output -name "*.json" | wc -l)
          echo "Total pharmacophore files generated: $TOTAL_FILES"
          echo "Expected entries: ${{ needs.setup.outputs.total_entries }}"
      
      - name: Create index file
        run: |
          cd Output
          python3 << 'EOF'
          import json
          import os
          from pathlib import Path
          
          index = {
              'total_pharmacophores': 0,
              'generation_date': '${{ github.run_id }}',
              'entries': []
          }
          
          for json_file in sorted(Path('.').glob('*.json')):
              if json_file.name == 'pharmacophore_index.json':
                  continue
              try:
                  with open(json_file) as f:
                      data = json.load(f)
                  index['entries'].append({
                      'filename': json_file.name,
                      'pdb_id': data.get('pdb_id'),
                      'ligand_name': data.get('ligand_name'),
                      'num_features': data.get('num_features', 0)
                  })
              except Exception as e:
                  print(f"Error reading {json_file}: {e}")
          
          index['total_pharmacophores'] = len(index['entries'])
          
          with open('pharmacophore_index.json', 'w') as f:
              json.dump(index, f, indent=2)
          
          print(f"Created index with {index['total_pharmacophores']} entries")
          EOF
      
      - name: Merge error logs
        run: |
          find artifacts/logs-batch-* -name "*.log" -type f -exec cat {} \; > combined_logs.txt
          
          # Extract errors
          grep "ERROR" combined_logs.txt > error_summary.txt || echo "No errors found" > error_summary.txt
      
      - name: Upload merged results
        uses: actions/upload-artifact@v4
        with:
          name: pharmacophores-complete
          path: Output/
          retention-days: 90
      
      - name: Upload error summary
        uses: actions/upload-artifact@v4
        with:
          name: processing-summary
          path: |
            error_summary.txt
            combined_logs.txt
          retention-days: 30
      
      - name: Summary
        run: |
          echo "## Pharmacophore Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Total entries processed**: $(find Output -name "*.json" ! -name "*index.json" | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **Expected entries**: ${{ needs.setup.outputs.total_entries }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Error count**: $(grep -c "ERROR" error_summary.txt || echo 0)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download artifacts from the Actions tab above." >> $GITHUB_STEP_SUMMARY
  
  build-database:
    name: Build Pharmacophore Database
    needs: merge
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.10'
          activate-environment: pharmit
      
      - name: Install dependencies
        shell: bash -el {0}
        run: |
          conda install -y -c conda-forge rdkit pandas numpy scipy python-dateutil
          python --version
          python -c "import scipy; print('scipy version:', scipy.__version__)"
      
      - name: Download merged pharmacophores
        uses: actions/download-artifact@v4
        with:
          name: pharmacophores-complete
          path: Output
      
      - name: Verify JSON files
        run: |
          JSON_COUNT=$(find Output -name "*.json" ! -name "*index.json" | wc -l)
          echo "Found $JSON_COUNT pharmacophore JSON files"
          
          if [ "$JSON_COUNT" -eq "0" ]; then
            echo "ERROR: No JSON files found to build database"
            exit 1
          fi
      
      - name: Build database
        shell: bash -el {0}
        run: |
          mkdir -p Database
          
          python build_pharmacophore_database.py \
            --json-dir Output \
            --output Database \
            --log-level INFO
          
          # Display statistics
          cat Database/build_log.json
      
      - name: Verify database
        shell: bash -el {0}
        run: |
          if [ ! -f "Database/pharmacophores.db" ]; then
            echo "ERROR: Database file not created"
            exit 1
          fi
          
          # Check database size
          DB_SIZE=$(du -h Database/pharmacophores.db | cut -f1)
          echo "Database size: $DB_SIZE"
          
          # Comprehensive database validation
          python << 'PYEOF'
          import sqlite3
          import sys
          
          conn = sqlite3.connect('Database/pharmacophores.db')
          cursor = conn.cursor()
          
          # Get table list
          tables = [row[0] for row in cursor.execute(
              "SELECT name FROM sqlite_master WHERE type='table'"
          ).fetchall()]
          
          print("\n=== Database Validation ===")
          print(f"Tables found: {len(tables)}")
          print(f"  {', '.join(tables)}")
          
          # Check schema version
          if 'schema_version' in tables:
              version = cursor.execute('SELECT version FROM schema_version').fetchone()[0]
              print(f"\nSchema version: v{version}")
              
              if version < 3:
                  print("⚠ WARNING: Schema version < 3, exit vectors not supported")
          
          # Count key tables
          stats = {}
          for table in ['molecules', 'features', 'triplets', 'inclusion_spheres', 
                       'exclusion_spheres', 'exit_vectors']:
              if table in tables:
                  count = cursor.execute(f'SELECT COUNT(*) FROM {table}').fetchone()[0]
                  stats[table] = count
                  print(f"  {table}: {count:,}")
              else:
                  print(f"  {table}: MISSING")
          
          # Validate exit vectors
          has_exit_vector_tables = all(t in tables for t in 
                                       ['inclusion_spheres', 'exclusion_spheres', 'exit_vectors'])
          
          if has_exit_vector_tables:
              if stats.get('exit_vectors', 0) > 0:
                  avg_vectors = stats['exit_vectors'] / max(stats['molecules'], 1)
                  print(f"\n✓ Exit vectors: {stats['exit_vectors']:,} total ({avg_vectors:.1f} per molecule)")
                  print("✓ Schema v3 with exit vectors ENABLED")
              else:
                  print("\n✗ ERROR: exit_vectors table exists but is EMPTY!")
                  print("  This means scipy was not available during build")
                  sys.exit(1)
          else:
              print("\n✗ ERROR: Exit vector tables missing (Schema v3 not created)")
              sys.exit(1)
          
          # Check R*Tree
          if 'triplet_rtree' in tables:
              rtree_count = cursor.execute('SELECT COUNT(*) FROM triplet_rtree').fetchone()[0]
              if rtree_count == stats.get('triplets', 0):
                  print(f"✓ R*Tree spatial index: {rtree_count:,} entries (consistent)")
              else:
                  print(f"⚠ R*Tree mismatch: {rtree_count} vs {stats.get('triplets', 0)} triplets")
          
          conn.close()
          print("\n✓ Database validation PASSED")
          PYEOF
      
      - name: Upload database artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pharmacophore-database
          path: |
            Database/pharmacophores.db
            Database/molecule_index.csv
            Database/build_log.json
          retention-days: 90
      
      - name: Database Summary
        run: |
          echo "## Database Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Parse build log
          MOLECULES_PROCESSED=$(jq -r '.statistics.molecules_processed' Database/build_log.json)
          MOLECULES_FAILED=$(jq -r '.statistics.molecules_failed' Database/build_log.json)
          FEATURES_STORED=$(jq -r '.statistics.features_stored' Database/build_log.json)
          TRIPLETS_GENERATED=$(jq -r '.statistics.triplets_generated' Database/build_log.json)
          VECTORS_STORED=$(jq -r '.statistics.vectors_stored' Database/build_log.json)
          RTREE_ENTRIES=$(jq -r '.statistics.rtree_entries' Database/build_log.json)
          
          # Exit vector stats
          INCLUSION_SPHERES=$(jq -r '.statistics.inclusion_spheres' Database/build_log.json)
          EXCLUSION_SPHERES=$(jq -r '.statistics.exclusion_spheres' Database/build_log.json)
          EXIT_VECTORS=$(jq -r '.statistics.exit_vectors' Database/build_log.json)
          
          echo "### Core Statistics" >> $GITHUB_STEP_SUMMARY
          echo "- **Molecules processed**: $MOLECULES_PROCESSED" >> $GITHUB_STEP_SUMMARY
          echo "- **Molecules failed**: $MOLECULES_FAILED" >> $GITHUB_STEP_SUMMARY
          echo "- **Total features**: $FEATURES_STORED" >> $GITHUB_STEP_SUMMARY
          echo "- **Total triplets**: $TRIPLETS_GENERATED" >> $GITHUB_STEP_SUMMARY
          echo "- **H-bond vectors**: $VECTORS_STORED" >> $GITHUB_STEP_SUMMARY
          echo "- **R*Tree entries**: $RTREE_ENTRIES" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Exit Vectors (Schema v3)" >> $GITHUB_STEP_SUMMARY
          echo "- **Inclusion spheres**: $INCLUSION_SPHERES" >> $GITHUB_STEP_SUMMARY
          echo "- **Exclusion spheres**: $EXCLUSION_SPHERES" >> $GITHUB_STEP_SUMMARY
          echo "- **Exit vectors**: $EXIT_VECTORS" >> $GITHUB_STEP_SUMMARY
          
          if [ "$EXIT_VECTORS" != "null" ] && [ "$EXIT_VECTORS" -gt "0" ]; then
            AVG_VECTORS=$(echo "scale=1; $EXIT_VECTORS / $MOLECULES_PROCESSED" | bc)
            echo "- **Avg vectors/molecule**: $AVG_VECTORS" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Exit vectors successfully computed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **WARNING: No exit vectors computed** (scipy may be missing)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Database size**: $(du -h Database/pharmacophores.db | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Database ready for download from artifacts!" >> $GITHUB_STEP_SUMMARY
